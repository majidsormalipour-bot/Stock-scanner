name: Daily Stock Scan

on:
  schedule:
    # هر روز ساعت ۲۲:۰۰ UTC (حدود نیم ساعت بعد از بسته‌شدن بازار آمریکا) - روزهای کاری
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions در گیت‌هاب

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run long-term scanner
        env:
          SCANNER_MAX_WORKERS: "2"
          SCANNER_BATCH_DELAY: "1.5"
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python market_scanner.py --top 15
        continue-on-error: true   # اگر یکی خطا داد، دیگری هم اجرا شود

      - name: Run short-term scanner
        env:
          SCANNER_MAX_WORKERS: "2"
          SCANNER_BATCH_DELAY: "1.5"
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python short_term_scanner.py --top 15
        continue-on-error: true

      - name: Run reversal (value at support) scanner
        env:
          SCANNER_MAX_WORKERS: "2"
          SCANNER_BATCH_DELAY: "1.5"
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python reversal_scanner.py --top 15
        continue-on-error: true

      # هر سه اسکنر هم data/universe_history.jsonl و هم data/picks_history.jsonl
      # را به‌روزرسانی می‌کنند (universe_tracking.py و picks_tracker.py) -
      # چون هر اجرای Actions روی یک runner تازه/ephemeral انجام می‌شود، اگر
      # این فایل‌ها commit نشوند، تاریخچه هر روز از صفر شروع می‌شود و کل هدف
      # ردیابی point-in-time / عملکرد واقعی بی‌اثر می‌ماند.
      - name: Commit updated history files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update universe & picks history [skip ci]"
          file_pattern: "data/universe_history.jsonl data/picks_history.jsonl"

      - name: Assemble site folder
        run: |
          mkdir -p site
          cp market_scan_report.html site/ 2>/dev/null || true
          cp short_term_scan_report.html site/ 2>/dev/null || true
          cp reversal_scan_report.html site/ 2>/dev/null || true
          # این فایل فقط هفتگی (توسط performance-scorecard.yml) ساخته و
          # commit می‌شود؛ اینجا فقط اگر از قبل در ریپو موجود باشد کپی
          # می‌شود تا در روزهایی که فقط اسکن روزانه اجرا می‌شود هم در
          # داشبورد باقی بماند.
          cp performance_scorecard.html site/ 2>/dev/null || true
          python generate_index.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
